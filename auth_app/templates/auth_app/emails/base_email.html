<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="color-scheme" content="dark light" />
    <meta name="supported-color-schemes" content="dark light" />
    <title>{% block title %}Videoflix{% endblock %}</title>
    <style>
      /* Client resets */
      body { margin: 0; padding: 0; width: 100% !important; }
      table { border-collapse: collapse; }
      img { border: 0; line-height: 100%; outline: none; text-decoration: none; }
      a { text-decoration: none; }

      /* Responsive: shrink the card and button on small screens */
      @media only screen and (max-width: 620px) {
        .email-container { width: 100% !important; }
        .email-card { padding: 28px 22px !important; }
        .email-button a { display: block !important; width: 100% !important; }
      }
    </style>
  </head>
  <body style="margin:0; padding:0; background-color:#0e0f1a;">
    <!-- Preheader: shown as preview text in the inbox, hidden in the body -->
    <div style="display:none; max-height:0; overflow:hidden; opacity:0; mso-hide:all;">
      {% block preheader %}{% endblock %}
    </div>

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
           style="background-color:#0e0f1a;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" class="email-container" width="600"
                 cellpadding="0" cellspacing="0"
                 style="width:600px; max-width:600px;">
            <!-- Header / brand -->
            <tr>
              <td align="center" style="padding:8px 0 24px 0;">
                <span style="font-family:Arial,Helvetica,sans-serif; font-size:26px;
                             font-weight:bold; letter-spacing:0.5px; color:#5b7cff;">
                  Videoflix
                </span>
              </td>
            </tr>

            <!-- Card -->
            <tr>
              <td class="email-card"
                  style="background-color:#1c1d2b; border-radius:12px;
                         padding:40px 40px; font-family:Arial,Helvetica,sans-serif;
                         color:#e7e8ef;">
                {% block content %}{% endblock %}
              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td align="center"
                  style="padding:24px 16px; font-family:Arial,Helvetica,sans-serif;
                         font-size:12px; line-height:18px; color:#8a8c9e;">
                You are receiving this email because an account was created with
                this address on Videoflix.<br />
                &copy; Videoflix. All rights reserved.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
