<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="color-scheme" content="light" />
    <meta name="supported-color-schemes" content="light" />
    <title>{% block title %}Videoflix{% endblock %}</title>
    <style>
      /* Client resets */
      body { margin: 0; padding: 0; width: 100% !important; }
      table { border-collapse: collapse; }
      img { border: 0; line-height: 100%; outline: none; text-decoration: none; }
      a { text-decoration: none; }

      /* Responsive */
      @media only screen and (max-width: 620px) {
        .email-container { width: 100% !important; }
        .email-body { padding: 24px 20px !important; }
        .email-button a { display: block !important; width: 100% !important; }
      }
    </style>
  </head>
  <body style="margin:0; padding:0; background-color:#ffffff;">
    <!-- Preheader: shown as preview text in the inbox, hidden in the body -->
    <div style="display:none; max-height:0; overflow:hidden; opacity:0; mso-hide:all;">
      {% block preheader %}{% endblock %}
    </div>

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
           style="background-color:#ffffff;">
      <tr>
        <td align="center" style="padding:24px 16px;">
          <table role="presentation" class="email-container" width="600"
                 cellpadding="0" cellspacing="0"
                 style="width:600px; max-width:600px;">
            <tr>
              <td class="email-body"
                  style="padding:24px 32px; font-family:Arial,Helvetica,sans-serif;
                         color:#2b2b33;">
                {% block header %}{% endblock %}
                {% block content %}{% endblock %}
                {% block footer %}{% endblock %}
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
